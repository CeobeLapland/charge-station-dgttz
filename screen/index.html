<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>充电运营数据大屏</title><link rel="stylesheet" href="css/dashboard.css"></head><body>
<div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark"></span><strong>充电运营数据大屏</strong></div><div class="status-cluster"><span id="connection-status">未连接</span><span id="last-updated">尚未更新</span><time id="clock"></time><button id="fullscreen-button" type="button">全屏</button></div></header>
<main class="page-container"><section id="filter-panel" class="filter-panel"><label>日期<input id="filter-date" type="date"></label><label>区域<select id="filter-region"><option value="">全部区域</option></select></label><label>充电站<select id="filter-station"><option value="">全部电站</option></select></label><button id="filter-submit" type="button">查询</button><button id="filter-reset" type="button">重置</button></section>
<section id="metric-cards" class="metric-grid"></section>
<section class="dashboard-grid">
<article class="panel"><h2>设备状态分布</h2><div id="status-chart" class="chart"></div></article>
<article class="panel wide"><h2>近 7 天订单趋势</h2><div id="order-trend-chart" class="chart"></div></article>
<article class="panel wide"><h2>近 7 天充电量与收入</h2><div id="energy-revenue-chart" class="chart"></div></article>
<article class="panel"><h2>TOP5 充电站</h2><div id="station-rank-chart" class="chart"></div></article>
<article class="panel wide"><h2>充电站地图</h2><div id="station-map" class="chart"></div></article>
<article class="panel alarm-panel"><h2>实时告警</h2><div class="alarm-head"><span>时间</span><span>站点 / 设备</span><span>告警内容</span></div><div id="alarm-list" class="alarm-list"></div></article>
</section></main></div><div id="error-banner" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script src="js/config.js"></script><script src="mock/snapshot.js"></script><script src="js/adapter.js"></script><script src="js/store.js"></script><script src="js/websocket-client.js"></script><script src="js/charts.js"></script><script src="js/components.js"></script><script src="js/app.js"></script></body></html>
