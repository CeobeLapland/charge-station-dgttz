<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电动汽车充电运营平台</title>
    <link rel="stylesheet" href="css/dashboard.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#overview" aria-label="返回运营概览">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span><strong>充电运营平台</strong></span>
        </a>
        <nav class="main-nav" aria-label="大屏页面导航">
          <button class="nav-item active" type="button" data-page-target="overview">运营概览</button>
          <button class="nav-item" type="button" data-page-target="stations">站点监控</button>
          <button class="nav-item" type="button" data-page-target="analytics">数据分析</button>
          <button class="nav-item" type="button" data-page-target="alarms">告警中心</button>
        </nav>
        <div class="status-cluster">
          <span id="connection-status" class="connection connection-offline">未连接</span>
          <time id="clock" aria-label="当前时间"></time>
        </div>
      </header>

      <main class="page-container">
        <section class="app-page active" data-page="overview" aria-labelledby="overview-title">
          <div class="page-heading">
            <div><h1 id="overview-title">今日运营情况</h1></div>
            <span id="last-updated" class="updated-time"><i aria-hidden="true"></i>尚未更新</span>
          </div>
          <section class="metric-grid" aria-label="核心运营指标">
            <article class="metric-card metric-blue"><span class="metric-label">今日营收</span><div><strong id="today-revenue" class="metric-value">--</strong><span class="metric-unit">元</span></div><small id="revenue-trend" class="metric-trend">等待数据</small></article>
            <article class="metric-card metric-indigo"><span class="metric-label">今日订单</span><div><strong id="today-orders" class="metric-value">--</strong><span class="metric-unit">笔</span></div><small id="orders-trend" class="metric-trend">等待数据</small></article>
            <article class="metric-card metric-orange"><span class="metric-label">当前充电</span><div><strong id="charging-count" class="metric-value">--</strong><span class="metric-unit">台</span></div><small class="metric-trend">根据设备状态实时更新</small></article>
            <article class="metric-card metric-green"><span class="metric-label">在线充电桩</span><div><strong id="online-rate" class="metric-value">--</strong><span class="metric-unit">%</span></div><small class="metric-trend">在线桩 / 总桩</small></article>
          </section>
          <section class="content-grid overview-grid">
            <article class="panel panel-large"><div class="panel-heading"><div><h2>实时功率负荷</h2></div></div><div id="load-chart" class="chart chart-large" role="img" aria-label="实时和预测功率负荷曲线"></div></article>
            <article class="panel"><div class="panel-heading"><div><h2>最新平台事件</h2></div></div><div id="event-stream" class="event-stream" aria-live="polite"></div></article>
          </section>
        </section>

        <section class="app-page" data-page="stations" aria-labelledby="stations-title" hidden>
          <div class="page-heading"><div><h1 id="stations-title">充电站运行状态</h1></div></div>
          <section class="content-grid two-column-grid">
            <article class="panel panel-large"><div class="panel-heading"><div><h2>充电站分布</h2></div></div><div id="station-chart" class="chart chart-large" role="img" aria-label="充电站分布散点图"></div></article>
            <article class="panel panel-large"><div class="panel-heading"><div><h2>站点利用率</h2></div></div><div id="utilization-chart" class="chart chart-large" role="img" aria-label="充电站利用率排名"></div></article>
          </section>
        </section>

        <section class="app-page" data-page="analytics" aria-labelledby="analytics-title" hidden>
          <div class="page-heading"><div><h1 id="analytics-title">业务趋势分析</h1></div></div>
          <section class="content-grid two-column-grid">
            <article class="panel panel-large"><div class="panel-heading"><div><h2>用户增长趋势</h2></div></div><div id="user-chart" class="chart chart-large" role="img" aria-label="用户增长趋势折线图"></div></article>
            <article class="panel panel-large"><div class="panel-heading"><div><h2>峰谷电量分析</h2></div></div><div id="energy-chart" class="chart chart-large" role="img" aria-label="峰平谷电量占比图"></div></article>
          </section>
        </section>

        <section class="app-page" data-page="alarms" aria-labelledby="alarms-title" hidden>
          <div class="page-heading"><div><h1 id="alarms-title">实时设备告警</h1></div><span class="alarm-summary">当前告警 <strong id="alarm-count">0</strong> 条</span></div>
          <article class="panel alarm-panel">
            <div class="alarm-table-heading" aria-hidden="true"><span>告警内容</span><span>所属位置</span><span>级别</span><span>发生时间</span></div>
            <div id="alarm-list" class="alarm-list" aria-live="polite"></div>
          </article>
        </section>
      </main>
    </div>

    <div id="error-banner" class="error-banner" role="alert" hidden></div>
    <!-- 正式离线交付前，将固定版本 ECharts 放入 vendor/ 并改为本地路径。 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="js/config.js"></script>
    <script src="mock/snapshot.js"></script>
    <script src="js/adapter.js"></script>
    <script src="js/store.js"></script>
    <script src="js/websocket-client.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
